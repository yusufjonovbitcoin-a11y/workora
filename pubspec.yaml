name: workora
description: AI job platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  supabase_flutter: ^2.8.1
  intl: ^0.19.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  intl_phone_field: ^3.2.0
  http: ^1.6.0
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/google_logo.svg
    - assets/icons/logo.png
    - assets/icons/logoaylana.png
    - assets/images/workora_hero.png
    - assets/images/auth_login_hero.webp
    - assets/images/auth_register_hero.png
